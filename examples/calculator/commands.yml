app: calculator
description: |
  A basic calculator as an example for the Drea Framework.
  Drea is available at https://github.com/david-antiteum/drea.

  Try:
    ./calculator sum 1 2 3
    ./calculator --validate                                  # check the config, exit 0
    ./calculator --equal banana sum 1 2 --validate           # bad value, exit 65
    ./calculator --config-file config-invalid.yml --validate # unknown key and bad value
    ./calculator --config-file config-invalid.yml --validate --json
env-prefix: CAL
options:
  - option: round
    description: round the result to the nearest integer
    type: bool
  - option: equal
    params-names: number
    description: check if the result is equal to <number>
    type: double
    short: e
commands:
  - command: sum
    params-names: number
    params: unlimited
    description: sum all the arguments
    local-options:
      - round
      - equal
  - command: power
    params: 2
    params-names: base exponent
    description: raise the first argument to the power of the second
    local-options:
      - round
      - equal
  - command: count
    params-names: string
    params: unlimited
    description: count the characters of a text arguments
    local-options:
      - equal
